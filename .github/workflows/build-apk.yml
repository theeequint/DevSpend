name: Build Android APK

on:
  push:
    branches:
      - mobile-apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Compile Web Application
        env:
          VITE_GITHUB_PAT: ${{ secrets.VITE_GITHUB_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          VITE_GITHUB_OWNER: ${{ vars.VITE_GITHUB_OWNER || 'theeequint' }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || 'DevSpend' }}
          VITE_GITHUB_BRANCH: ${{ vars.VITE_GITHUB_BRANCH || 'main' }}
        run: npm run build

      - name: Add or Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy & Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DevSpend.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevSpend-apk
          path: DevSpend.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "DevSpend Android App (Latest)"
          body: "Automated Android APK build generated from the mobile-apk branch."
          files: DevSpend.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
